  # ─────────────────────────────────────────────────────────────────────────
  # Images — generated files
  # ─────────────────────────────────────────────────────────────────────────
  /v1/images/proxy:
    get:
      operationId: proxyImage
      summary: Fetch a generated image
      description: >
        Fetches a generated image, or a generated video or audio file, from the
        temporary link returned by the generation endpoints. The response is the
        file itself. Do not build this URL yourself; use the url value you
        received. The link expires after a short period: after that, this
        endpoint returns HTTP 403. Send a `Range` header to fetch part of the
        file (HTTP 206), for example to seek in a video or audio player.
        Example: https://api.devupai.com/v1/images/proxy?d=<token>&s=<signature>
      tags: [Images]
      security: []
      parameters:
        - name: d
          in: query
          required: true
          description: Opaque value from the returned link.
          schema:
            type: string
          example: <token>
        - name: s
          in: query
          required: true
          description: Opaque value from the returned link.
          schema:
            type: string
          example: <signature>
      responses:
        '200':
          description: The generated file.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
            Content-Length:
              description: Size of the file, in bytes.
              schema:
                type: integer
            Accept-Ranges:
              description: The file can be fetched in parts with a `Range` request header.
              schema:
                type: string
                example: bytes
            Cache-Control:
              description: Always `private, no-store`. Download the file and keep your own copy.
              schema:
                type: string
                example: private, no-store
        '206':
          description: >
            Part of the file, for a request with one `Range: bytes=<start>-<end>`
            header (or `bytes=<start>-`, or `bytes=-<length>`). The content type is
            the file's own. A `Range` header in any other form is answered with the
            whole file (HTTP 200).
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
            Content-Range:
              description: The bytes returned and the size of the whole file.
              schema:
                type: string
                example: bytes 0-1023/1048576
            Content-Length:
              description: Size of this part, in bytes.
              schema:
                type: integer
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Cache-Control:
              schema:
                type: string
                example: private, no-store
        '403':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: >
            The link is not valid: `d` or `s` is missing or does not match, or the
            link has expired. Use the url returned by the generation endpoint
            before it expires, or request the file again.
          content:
            text/plain:
              schema:
                type: string
              example: Forbidden
        '404':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: The file is not available.
          content:
            text/plain:
              schema:
                type: string
              example: Image not available
        '416':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
            Content-Range:
              description: The size of the whole file, when it is known.
              schema:
                type: string
                example: bytes */1048576
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          description: >
            The requested range cannot be served from this file (it starts at or
            after the end of the file). The body is empty.
        '500':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: The file is temporarily unavailable. Retry the request.
          content:
            text/plain:
              schema:
                type: string
              example: Image not available
        '502':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: The image is not available.
          content:
            text/plain:
              schema:
                type: string
              example: Image not available

