openapi: 3.1.0
info:
  title: DEVUP AI API
  version: 1.0.0
  description: >
    The DEVUP AI API provides one API with OpenAI-compatible
    interfaces for chat completions, embeddings, model listing, and selected
    multimodal request formats, alongside DEVUP-native image, speech, video,
    native inference, and account operations.

    Authenticate with a DEVUP AI Bearer API key and pay in Algerian Dinar
    according to the applicable usage unit, including tokens, characters,
    audio duration, or generated items.

    A request to a path under `/v1/` that is not an endpoint returns HTTP 404
    with `error.code` `endpoint_not_found` and the message
    "No endpoint exists at {METHOD} {path}." It is not retryable; check the
    method and path.
  contact:
    name: DEVUP AI Support
    url: https://devupai.com
  license:
    name: Proprietary
    url: https://devupai.com/terms

servers:
  - url: https://api.devupai.com
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Chat
    description: OpenAI-compatible chat completions (streaming and non-streaming).
  - name: Responses
    description: OpenAI-compatible Responses API for modern request/response interactions with any text model in the catalog (streaming and non-streaming).
  - name: Embeddings
    description: Generate embedding vectors from text.
  - name: Reranking
    description: Rerank documents according to their semantic relevance to a query.
  - name: Images
    description: Generate images from text prompts, and serve the generated files.
  - name: Audio
    description: Text-to-speech synthesis and speech-to-text transcription.
  - name: Video
    description: Text-to-video and video editing generation.
  - name: Models
    description: List all available models, or retrieve one, in OpenAI-compatible format.
  - name: Inference
    description: Native inference — send a model's own request format to it through one path.
  - name: Account
    description: Account balance and profile.

  - name: Utilities
    description: Platform health and status checks.

paths:
  # ─────────────────────────────────────────────────────────────────────────
  # Chat
  # ─────────────────────────────────────────────────────────────────────────
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      description: >
        Generates a model response for the given conversation. Supports
        streaming via `stream: true` (SSE). Non-streaming responses include a
        `_devup` billing metadata object. The request body can be up to
        10,485,760 bytes (10 MiB), Base64-encoded image and PDF data included;
        a larger body returns HTTP 413 `payload_too_large`.
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            example:
              model: deepseek-ai/DeepSeek-V4-Pro
              messages:
                - role: user
                  content: Hello from Algeria!
              max_tokens: 256
              stream: false
      responses:
        '200':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
            X-DEVUP-Warnings:
              $ref: '#/components/headers/XDevupWarnings'
          description: >
            Successful chat completion: a JSON object, or a Server-Sent Events stream
            when the request sets `stream: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
              example:
                id: chatcmpl-79037612-d7c2-43e0-8494-c560f97c61ea
                object: chat.completion
                created: 1700000000
                model: deepseek-ai/DeepSeek-V4-Pro
                choices:
                  - index: 0
                    message:
                      role: assistant
                      content: Hello! How can I help you today?
                    finish_reason: stop
                usage:
                  prompt_tokens: 10
                  completion_tokens: 8
                _devup:
                  request_id: req_9fd8ddec5b2149539860a86dccba58cf
                # Abridged: _devup also carries cost_dzd and balance_dzd.
            text/event-stream:
              schema:
                description: >
                  Server-Sent Events stream. Each `data:` line carries one
                  `ChatCompletionChunk`. Every chunk carries the same `id` (`chatcmpl-`
                  followed by a UUID). When the model completes its reply, the last chunk
                  has an empty `choices` array and carries `usage`; no other chunk carries
                  `usage`. The `data: [DONE]` terminal event may not be present in every
                  stream. An error after the stream has started arrives as one
                  `ChatCompletionStreamError` event followed by `data: [DONE]`; a stream
                  can also end without either. An error before the first event is
                  answered with its HTTP status and an `ErrorResponse` body instead of
                  a stream. Informational notices are in the
                  `X-DEVUP-Warnings` response header.
                oneOf:
                  - $ref: '#/components/schemas/ChatCompletionChunk'
                  - $ref: '#/components/schemas/ChatCompletionStreamError'
        '400':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: Invalid request body or parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_model:
                  summary: Missing model field
                  value:
                    error:
                      message: 'The "model" field is required.'
                      type: devup_error
                      code: missing_model
                payload_too_large:
                  summary: Messages array too large
                  value:
                    error:
                      message: messages array exceeds the maximum of 512 entries.
                      type: devup_error
                      code: payload_too_large
                invalid_max_tokens:
                  summary: max_tokens above the model's max_output_tokens (N here)
                  value:
                    error:
                      message: max_tokens must be between 1 and N.
                      type: devup_error
                      code: invalid_max_tokens
                use_responses_api:
                  summary: Model or feature served on /v1/responses only
                  value:
                    error:
                      message: This model is served on /v1/responses and does not support Chat Completions. Send the same request to /v1/responses.
                      type: devup_error
                      code: use_responses_api
                wrong_endpoint:
                  summary: The model is served on another endpoint (not billed)
                  value:
                    error:
                      message: This model is served on /v1/images/generations, not on /v1/chat/completions. Send the request to /v1/images/generations.
                      type: devup_error
                      code: wrong_endpoint
                tools_not_supported:
                  summary: The model does not support tool calling
                  value:
                    error:
                      message: This model does not support tool calling. Remove tools and tool_choice from the request.
                      type: devup_error
                      code: tools_not_supported
                conversation_must_end_with_user:
                  summary: The model needs a final user message
                  value:
                    error:
                      message: This model needs the conversation to end with a user message.
                      type: devup_error
                      code: conversation_must_end_with_user
                empty_message_content:
                  summary: A message has empty content
                  value:
                    error:
                      message: A message in the request has empty content, which this model does not accept. Give every message non-empty content.
                      type: devup_error
                      code: empty_message_content
                feature_not_supported:
                  summary: A feature in the request is not available on this model
                  value:
                    error:
                      message: This model does not support a feature used in the request. Check the model page for what it supports.
                      type: devup_error
                      code: feature_not_supported
                response_format_not_supported:
                  summary: The model does not support the requested response_format
                  value:
                    error:
                      message: This model does not support the requested response_format. Remove response_format, or check the model page for the formats it supports.
                      type: devup_error
                      code: response_format_not_supported
                invalid_request_error:
                  summary: The model rejected the request
                  value:
                    error:
                      message: The model rejected the request. Check the messages and parameters against the API reference.
                      type: devup_error
                      code: invalid_request_error
                unsupported_content_image:
                  summary: An image sent to a model whose supports.vision is false (not charged)
                  value:
                    error:
                      message: This model does not accept image input. Choose a model whose supports.vision is true.
                      type: devup_error
                      code: unsupported_content
                unsupported_content_pdf:
                  summary: A PDF file sent to a model whose supports.pdf_input is false (not charged)
                  value:
                    error:
                      message: This model does not accept PDF input. Choose a model whose supports.pdf_input is true.
                      type: devup_error
                      code: unsupported_content
                unsupported_content_file:
                  summary: A file part that is not an inline PDF (not charged)
                  value:
                    error:
                      message: Only PDF files are accepted in file parts.
                      type: devup_error
                      code: unsupported_content
                invalid_request_body:
                  summary: The request body is not valid JSON
                  value:
                    error:
                      message: Request body must be valid JSON.
                      type: devup_error
                      code: invalid_request_body
                missing_tools:
                  summary: tool_choice forces a tool call, and tools is missing or empty
                  value:
                    error:
                      message: "'tools' is missing or empty. A tool_choice that forces a tool call (\"required\" or a named function) needs at least one tool in 'tools'."
                      type: devup_error
                      code: missing_tools
                invalid_value:
                  summary: n is not a whole number of at least 1
                  value:
                    error:
                      message: n must be a whole number of at least 1.
                      type: devup_error
                      code: invalid_value
                context_length_exceeded:
                  summary: The request is longer than the model's context window
                  value:
                    error:
                      message: The request is longer than this model's context window.
                      type: devup_error
                      code: context_length_exceeded
                structured_output_mismatch:
                  summary: The reply does not match a strict json_schema (not billed)
                  value:
                    error:
                      message: This model's reply does not match the requested json_schema. The request was not billed. Retry it, or simplify the schema.
                      type: devup_error
                      code: structured_output_mismatch
                unsupported_parameter:
                  summary: reasoning_effort together with tools, on a model that does not accept the two together
                  value:
                    error:
                      message: 'This model does not accept reasoning_effort together with tools on /v1/chat/completions. Set reasoning_effort to "none", remove the tools, or use /v1/responses.'
                      type: devup_error
                      code: unsupported_parameter
                invalid_request_format:
                  summary: The request does not match the format the model expects
                  value:
                    error:
                      message: The request does not match the format this model expects. Check messages[0].content.
                      type: devup_error
                      code: invalid_request_format
                scoped_budget_unbounded_request:
                  summary: This request is not accepted under a scoped token's spending limit (not billed)
                  value:
                    error:
                      message: This request cannot be bounded before execution under a Scoped JWT spending limit. Use a supported bounded model or an account API key.
                      type: devup_error
                      code: scoped_budget_unbounded_request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: >
            The request body is larger than 10,485,760 bytes (10 MiB). Base64-encoded
            file data counts toward this limit. The body is not processed and the
            request is not charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The request body exceeds the limit of 10,485,760 bytes (10 MiB). Base64-encoded file data counts toward this limit.
                  type: devup_error
                  code: payload_too_large
        '415':
          $ref: '#/components/responses/UnprocessableRequest'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/RequestNotCompleted'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─────────────────────────────────────────────────────────────────────────
  # Responses
  # ─────────────────────────────────────────────────────────────────────────
  /v1/responses:
    post:
      operationId: createResponse
      summary: Create a model response
      description: >
        Generates a model response using the OpenAI-compatible Responses API.
        Works with any text model in the catalog; pass its model id as `model`.
        Set `stream: true` to receive the response as Server-Sent Events.
        Responses are not stored (`store` is always `false`). A non-streaming request
        returns a Responses object with a `_devup` billing metadata object.
      tags: [Responses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
            example:
              model: openai/gpt-5.6-luna
              input: Explain how quantum key distribution works in one paragraph.
              max_output_tokens: 512
      responses:
        '200':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
            X-DEVUP-Warnings:
              $ref: '#/components/headers/XDevupWarnings'
          description: >
            Successful response generation: a Responses object as JSON, or a
            stream of Server-Sent Events when `stream: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
              example:
                id: resp_01j8k9m0n1p2q3r4s5t6u7v8w9
                object: response
                created_at: 1700000000
                model: openai/gpt-5.6-luna
                status: completed
                output:
                  - id: msg_01j8k9m0n1p2q3r4s5t6u7v8wa
                    type: message
                    role: assistant
                    status: completed
                    content:
                      - type: output_text
                        text: Quantum key distribution uses principles of quantum mechanics...
                        annotations: []
                usage:
                  input_tokens: 12
                  output_tokens: 45
                  total_tokens: 57
                # Abridged: the response also carries the _devup billing metadata object.
            text/event-stream:
              schema:
                type: string
                description: >
                  Server-Sent Events stream of Responses events. Each event has an
                  `event:` line naming its type and a `data:` line with the JSON
                  event (`ResponsesStreamEvent`), numbered by a contiguous
                  `sequence_number`. A client reads `response.created`, then
                  `response.output_text.delta` events with the text,
                  `response.output_item.done` as each output item finishes, and one
                  final event with the final response and its `usage`:
                  `response.completed`, or `response.incomplete` when the output
                  ends before the model finishes (`incomplete_details.reason` says
                  why, for example `max_output_tokens`). If the response cannot be
                  completed, the stream ends with `response.failed` followed by one
                  `error` event (`ResponsesStreamErrorEvent`) with an error `code`.
                  Nothing is sent
                  after these events, and the stream has no `data: [DONE]` line.
                  Other event types can appear (see `ResponsesStreamEvent`); skip
                  any type your client does not handle.
              example: |
                event: response.created
                data: {"type":"response.created","sequence_number":0,"response":{"id":"resp_01j8k9m0n1p2q3r4s5t6u7v8w9","object":"response","created_at":1700000000,"model":"deepseek-ai/DeepSeek-V4-Pro","status":"in_progress","output":[],"usage":null}}

                event: response.output_text.delta
                data: {"type":"response.output_text.delta","sequence_number":4,"item_id":"msg_01j8k9m0n1p2q3r4s5t6u7v8wa","output_index":0,"content_index":0,"delta":"Golden dunes"}

                event: response.output_item.done
                data: {"type":"response.output_item.done","sequence_number":9,"output_index":0,"item":{"id":"msg_01j8k9m0n1p2q3r4s5t6u7v8wa","type":"message","role":"assistant","status":"completed","content":[{"type":"output_text","text":"Golden dunes at dawn...","annotations":[]}]}}

                event: response.completed
                data: {"type":"response.completed","sequence_number":10,"response":{"id":"resp_01j8k9m0n1p2q3r4s5t6u7v8w9","object":"response","created_at":1700000000,"model":"deepseek-ai/DeepSeek-V4-Pro","status":"completed","output":[{"id":"msg_01j8k9m0n1p2q3r4s5t6u7v8wa","type":"message","role":"assistant","status":"completed","content":[{"type":"output_text","text":"Golden dunes at dawn...","annotations":[]}]}],"usage":{"input_tokens":14,"output_tokens":21,"total_tokens":35}}}
        '400':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: Invalid request body or unsupported parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_model:
                  summary: Missing model field
                  value:
                    error:
                      message: 'The "model" field is required and must be a non-empty string.'
                      type: devup_error
                      code: missing_model
                unsupported_parameter:
                  summary: Unsupported parameter reasoning_effort
                  value:
                    error:
                      message: "Unsupported parameter: 'reasoning_effort'. In the Responses API, this parameter has moved to 'reasoning.effort'. Use 'reasoning: { effort: ... }' instead."
                      type: devup_error
                      code: unsupported_parameter
                unsupported_parameter_unknown:
                  summary: Parameter not accepted
                  value:
                    error:
                      message: "Unsupported parameter: 'unknown_field'."
                      type: devup_error
                      code: unsupported_parameter
                tool_type_not_available:
                  summary: Tool type not accepted
                  value:
                    error:
                      message: "Tool type 'example_tool' is not available. Remove it from the request."
                      type: devup_error
                      code: unsupported_parameter
                wrong_endpoint:
                  summary: The model is served on another endpoint (not billed)
                  value:
                    error:
                      message: This model is served on /v1/embeddings, not on /v1/responses. Send the request to /v1/embeddings.
                      type: devup_error
                      code: wrong_endpoint
                invalid_max_tokens:
                  summary: max_output_tokens above the model's max_output_tokens (N here)
                  value:
                    error:
                      message: max_output_tokens must be between 1 and N.
                      type: devup_error
                      code: invalid_max_tokens
                tools_not_supported:
                  summary: The model does not support tool calling
                  value:
                    error:
                      message: This model does not support tool calling. Remove tools and tool_choice from the request.
                      type: devup_error
                      code: tools_not_supported
                conversation_must_end_with_user:
                  summary: The model needs a final user message
                  value:
                    error:
                      message: This model needs the conversation to end with a user message.
                      type: devup_error
                      code: conversation_must_end_with_user
                invalid_request_body:
                  summary: The request body is not a JSON object
                  value:
                    error:
                      message: Request body must be a valid JSON object.
                      type: devup_error
                      code: invalid_request_body
                missing_tools:
                  summary: tool_choice forces a tool call, and tools is missing or empty
                  value:
                    error:
                      message: "'tools' is missing or empty. A tool_choice that forces a tool call (\"required\" or a named function) needs at least one tool in 'tools'."
                      type: devup_error
                      code: missing_tools
                context_length_exceeded:
                  summary: The request is longer than the model's context window
                  value:
                    error:
                      message: The request is longer than this model's context window.
                      type: devup_error
                      code: context_length_exceeded
                structured_output_mismatch:
                  summary: The reply does not match a strict json_schema in text.format (not billed)
                  value:
                    error:
                      message: This model's reply does not match the requested json_schema. The request was not billed. Retry it, or simplify the schema.
                      type: devup_error
                      code: structured_output_mismatch
                invalid_request_format:
                  summary: The request does not match the format the model expects
                  value:
                    error:
                      message: The request does not match the format this model expects.
                      type: devup_error
                      code: invalid_request_format
                scoped_budget_unbounded_request:
                  summary: This request is not accepted under a scoped token's spending limit (not billed)
                  value:
                    error:
                      message: This request cannot be bounded before execution under a Scoped JWT spending limit. Use a supported bounded model or an account API key.
                      type: devup_error
                      code: scoped_budget_unbounded_request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnprocessableRequest'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/RequestNotCompleted'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─────────────────────────────────────────────────────────────────────────
  # Embeddings
  # ─────────────────────────────────────────────────────────────────────────
  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: Create embeddings
      description: >
        Generates embedding vectors for the given input text or array of
        texts. Compatible with the OpenAI embeddings API.
      tags: [Embeddings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            example:
              model: Qwen/Qwen3-Embedding-8B
              input: Hello world
              encoding_format: float
      responses:
        '200':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: Embedding vectors generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
              example:
                object: list
                data:
                  - object: embedding
                    index: 0
                    embedding: [0.0023, -0.0091, 0.0152]
                model: Qwen/Qwen3-Embedding-8B
                usage:
                  prompt_tokens: 2
                  total_tokens: 2
                _devup:
                  request_id: req_9fd8ddec5b2149539860a86dccba58cf
                # Abridged: _devup also carries cost_dzd and balance_dzd.
        '400':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: Invalid request body or parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_model:
                  summary: Missing model field
                  value:
                    error:
                      message: 'The "model" field is required.'
                      type: devup_error
                      code: missing_model
                payload_too_large:
                  summary: Input array too large
                  value:
                    error:
                      message: input array exceeds the maximum of 2,048 entries.
                      type: devup_error
                      code: payload_too_large
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientBalance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnprocessableRequest'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/RequestNotCompleted'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ─────────────────────────────────────────────────────────────────────────
  # Reranking
  # ─────────────────────────────────────────────────────────────────────────
  /v1/rerank:
    post:
      operationId: createReranking
      summary: Rerank documents
      description: >
        Reranks a list of documents based on their semantic relevance to the provided query.
        Returns a sorted list of relevance scores and optionally the documents themselves.
      tags: [Reranking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
            example:
              model: Qwen/Qwen3-Reranker-8B
              query: "What is DEVUP AI?"
              documents:
                - "DEVUP AI is an API for open-source and frontier models."
                - "Paris is the capital of France."
      responses:
        '200':
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            x-client-request-id:
              $ref: '#/components/headers/XClientRequestId'
          description: Documents reranked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
              example:
                object: list
                model: Qwen/Qwen3-Reranker-8B
                results:
                  - index: 0
                    relevance_score: 0.9854
                  - index: 1
                    relevance_score: 0.0012
                _devup:
                  request_id: req_9fd8ddec5b2149539860a86dccba58cf
                # Abridged: _devup also carries cost_dzd and balance_dzd.
        '400':
          headers:
            x-request-id:
